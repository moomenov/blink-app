<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITA STADION Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>ITA STADION</h1>
            <p class="address">📍 Toshkent sh., Chilonzor tumani, 5-mavze</p>
        </header>

        <div class="field-selection">
            <h3>Maydon turini tanlang:</h3>
            <select id="field-type">
                <option value="suniy">Sun'iy maydon (1 ta)</option>
                <option value="tabiiy" selected>Tabiiy maydon (4 ta)</option>
            </select>
        </div>

        <div class="time-selection">
            <h3>Vaqtni tanlang (Haftalik)</h3>
            <div class="timetable" id="timetable">
                </div>
        </div>

        <div class="payment-section">
            <h3>To'lov ma'lumotlari</h3>
            <div class="card-box">
                <p>Karta: <strong>5614 6814 0522 1999</strong></p>
                <p>Eshasi: <strong>Mo'minov X.</strong></p>
            </div>
            <p class="total-text">To'lov summasi: <span id="total-price">0</span> so'm</p>
            
            <div class="upload-area">
                <input type="file" id="file-input" hidden>
                <label for="file-input" class="file-label">Chekni yuklash</label>
                <button class="confirm-btn">Tasdiqlash</button>
            </div>
        </div>

        <div class="jarvis-chat">
            <p class="jarvis-title">Jarvis AI Assistant</p>
            <div class="input-group">
                <input type="text" id="chat-input" placeholder="Savolingizni yozing...">
                <button id="send-chat">➤</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
